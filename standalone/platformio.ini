[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -O2
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341

; Lower-resolution build for the Wokwi simulator only (see README)
[env:sim]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -O2 -DSIM_PROFILE
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341
